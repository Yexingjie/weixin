name: weixin每日推送
on:
  workflow_dispatch: # 手动触发
  schedule:
    # UTC 0点 = 北京时间早上8点推送
    - cron: '0 22 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python3.9环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 设置上海时区
        run: echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: 升级pip并安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打印目录文件（确认config.txt存在）
        run: ls -la

      - name: 执行微信推送脚本
        run: python3 main.py
